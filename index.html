<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Model Rotation with Zoom Controls</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Style untuk tombol kontrol */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .zoom-controls {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .button {
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
    }

    .button:active {
      background-color: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <a-scene>
    <!-- Pencahayaan -->
    <a-light type="directional" position="2 4 5" intensity="1"></a-light>
    <a-light type="ambient" intensity="0.5"></a-light>

    <!-- 3D Model -->
    <a-entity 
      id="model"
      gltf-model="./model/scene.gltf"
      position="0 0 -3"  
      scale="100 100 100"  
      rotation="0 -20 0">
    </a-entity>

    <!-- Camera Rig -->
    <a-entity id="cameraRig" position="0 1.6 2" rotation="-30 0 0">
      <a-entity id="camera" camera look-controls></a-entity>
    </a-entity>
  </a-scene>

  <!-- Tombol Kontrol Rotasi -->
  <div class="controls">
    <button class="button" id="rotateLeft">←</button>
    <button class="button" id="rotateRight">→</button>
    <button class="button" id="tiltUp">↑</button>
    <button class="button" id="tiltDown">↓</button>
  </div>

  <!-- Tombol Kontrol Zoom -->
  <div class="zoom-controls">
    <button class="button" id="zoomIn">+</button>
    <button class="button" id="zoomOut">-</button>
  </div>

  <script>
    const model = document.querySelector("#model");
    const cameraRig = document.querySelector("#cameraRig");

    let rotateInterval = null; // Variabel untuk menyimpan interval rotasi
    let zoomInterval = null; // Variabel untuk menyimpan interval zoom

    // Fungsi untuk memulai rotasi
    function startRotation(axis, value) {
      if (rotateInterval) return; // Mencegah duplikasi interval
      rotateInterval = setInterval(() => {
        let rotation = model.getAttribute("rotation");
        rotation[axis] += value;
        model.setAttribute("rotation", rotation);
      }, 50); // Rotasi setiap 50ms
    }

    // Fungsi untuk menghentikan rotasi
    function stopRotation() {
      clearInterval(rotateInterval);
      rotateInterval = null;
    }

    // Fungsi untuk memulai zoom
    function startZoom(value) {
      if (zoomInterval) return;
      zoomInterval = setInterval(() => {
        let position = cameraRig.getAttribute("position");
        position.z += value;
        if (position.z < 1) position.z = 1; // Batas zoom in agar tidak terlalu dekat
        if (position.z > 10) position.z = 10; // Batas zoom out agar tidak terlalu jauh
        cameraRig.setAttribute("position", position);
      }, 50);
    }

    // Fungsi untuk menghentikan zoom
    function stopZoom() {
      clearInterval(zoomInterval);
      zoomInterval = null;
    }

    // Event Listener untuk tombol rotasi
    document.querySelector("#rotateLeft").addEventListener("mousedown", () => startRotation("y", -5));
    document.querySelector("#rotateRight").addEventListener("mousedown", () => startRotation("y", 5));
    document.querySelector("#tiltUp").addEventListener("mousedown", () => startRotation("x", -5));
    document.querySelector("#tiltDown").addEventListener("mousedown", () => startRotation("x", 5));

    // Event Listener untuk tombol zoom
    document.querySelector("#zoomIn").addEventListener("mousedown", () => startZoom(-0.1));
    document.querySelector("#zoomOut").addEventListener("mousedown", () => startZoom(0.1));

    // Menghentikan aksi saat tombol dilepas
    document.addEventListener("mouseup", stopRotation);
    document.addEventListener("mouseleave", stopRotation);
    document.addEventListener("mouseup", stopZoom);
    document.addEventListener("mouseleave", stopZoom);

    // Untuk mendukung mobile (sentuhan layar)
    document.querySelector("#rotateLeft").addEventListener("touchstart", () => startRotation("y", -5));
    document.querySelector("#rotateRight").addEventListener("touchstart", () => startRotation("y", 5));
    document.querySelector("#tiltUp").addEventListener("touchstart", () => startRotation("x", -5));
    document.querySelector("#tiltDown").addEventListener("touchstart", () => startRotation("x", 5));

    document.querySelector("#zoomIn").addEventListener("touchstart", () => startZoom(-0.1));
    document.querySelector("#zoomOut").addEventListener("touchstart", () => startZoom(0.1));

    document.addEventListener("touchend", stopRotation);
    document.addEventListener("touchend", stopZoom);
  </script>

</body>
</html>
